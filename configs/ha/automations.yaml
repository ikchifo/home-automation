- id: reload_dreo_on_startup
  alias: "Reload Dreo after startup if unavailable"
  description: >-
    After a restart, cloud-dependent integrations can fail if DNS is not
    ready yet.  This waits 60 s then reloads Dreo when the fan entity is
    still unavailable.
  mode: single
  trigger:
    - platform: homeassistant
      event: start
  condition:
    - condition: state
      entity_id: fan.air_circulator
      state: "unavailable"
  action:
    - delay:
        seconds: 60
    - service: homeassistant.reload_config_entry
      data:
        entry_id: <DREO_ENTRY_ID>
