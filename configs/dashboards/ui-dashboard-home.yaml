          }
        1_link: /home-dashboard/home
        1_name: Home
        1_icon: mdi:home
        2_link: /home-dashboard/living-room
        2_name: Living Room
        2_icon: mdi:sofa
        3_link: /home-dashboard/kitchen
        3_name: Kitchen
        3_icon: mdi:countertop
        4_link: /home-dashboard/bedroom
        4_name: Bedroom
        4_icon: mdi:bed

    sections:
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Lights

          - type: custom:mushroom-light-card
            entity: light.living_room
            name: All Lights
            icon: mdi:lightbulb-group
            use_light_color: true
            show_brightness_control: true
            show_color_temp_control: true

          - type: horizontal-stack
            cards:
              - type: custom:mushroom-light-card
                entity: light.living_room_a
                name: A
                use_light_color: true
                show_brightness_control: true
                layout: vertical
              - type: custom:mushroom-light-card
                entity: light.living_room_b
                name: B
                use_light_color: true
                show_brightness_control: true
                layout: vertical
              - type: custom:mushroom-light-card
                entity: light.living_room_c
                name: C
                use_light_color: true
                show_brightness_control: true
                layout: vertical
              - type: custom:mushroom-light-card
                entity: light.living_room_d
                name: D
                use_light_color: true
                show_brightness_control: true
                layout: vertical

          - type: custom:mushroom-title-card
            title: Scenes

          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                entity: scene.living_room_relax
                primary: Relax
                icon: mdi:sofa
                icon_color: orange
                layout: vertical
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  target:
                    entity_id: scene.living_room_relax
              - type: custom:mushroom-template-card
                entity: scene.living_room_bright
                primary: Bright
                icon: mdi:brightness-7
                icon_color: yellow
                layout: vertical
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  target:
                    entity_id: scene.living_room_bright
              - type: custom:mushroom-template-card
                entity: scene.living_room_energize
                primary: Energize
                icon: mdi:flash
                icon_color: cyan
                layout: vertical
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  target:
                    entity_id: scene.living_room_energize
              - type: custom:mushroom-template-card
                entity: scene.living_room_read
                primary: Read
                icon: mdi:book-open-variant
                icon_color: amber
                layout: vertical
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  target:
                    entity_id: scene.living_room_read

          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                entity: scene.living_room_lovebirds
                primary: Lovebirds
                icon: mdi:heart
                icon_color: pink
                layout: vertical
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  target:
                    entity_id: scene.living_room_lovebirds
              - type: custom:mushroom-template-card
                entity: scene.living_room_malibu_pink
                primary: Malibu
                icon: mdi:palm-tree
                icon_color: pink
                layout: vertical
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  target:
                    entity_id: scene.living_room_malibu_pink
              - type: custom:mushroom-template-card
                entity: scene.living_room_ruby_romance
                primary: Ruby
                icon: mdi:diamond-stone
                icon_color: red
                layout: vertical
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  target:
                    entity_id: scene.living_room_ruby_romance
              - type: custom:mushroom-template-card
                entity: scene.living_room_winter_mountain
                primary: Winter
                icon: mdi:snowflake
                icon_color: blue
                layout: vertical
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  target:
                    entity_id: scene.living_room_winter_mountain

      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: TV

          - type: custom:mushroom-media-player-card
            entity: media_player.living_room_tv_2
            name: Living Room TV
            use_media_info: true
            show_volume_level: true
            media_controls:
              - on_off
              - play_pause_stop
            volume_controls:
              - volume_buttons
              - volume_mute
              - volume_set

          - type: custom:mushroom-title-card
            title: TV Remote

          - type: grid
            columns: 3
            cards:
              - type: custom:mushroom-template-card
                primary: VOL +
                icon: mdi:volume-plus
                layout: vertical
                tap_action:
                  action: call-service
                  service: remote.send_command
                  target:
                    entity_id: remote.living_room_tv
                  data:
                    command: VolumeUp
              - type: custom:mushroom-template-card
                primary: Up
                icon: mdi:chevron-up
                layout: vertical
                tap_action:
                  action: call-service
                  service: remote.send_command
                  target:
                    entity_id: remote.living_room_tv
                  data:
                    command: Up
              - type: custom:mushroom-template-card
                primary: CH +
                icon: mdi:chevron-double-up
                layout: vertical
                tap_action:
                  action: call-service
                  service: remote.send_command
                  target:
                    entity_id: remote.living_room_tv
                  data:
                    command: ChannelUp
              - type: custom:mushroom-template-card
                primary: Left
                icon: mdi:chevron-left
                layout: vertical
                tap_action:
                  action: call-service
                  service: remote.send_command
                  target:
                    entity_id: remote.living_room_tv
                  data:
                    command: Left
              - type: custom:mushroom-template-card
                primary: OK
                icon: mdi:checkbox-blank-circle
                layout: vertical
                tap_action:
                  action: call-service
                  service: remote.send_command
                  target:
                    entity_id: remote.living_room_tv
                  data:
                    command: Confirm
              - type: custom:mushroom-template-card
                primary: Right
                icon: mdi:chevron-right
                layout: vertical
                tap_action:
                  action: call-service
                  service: remote.send_command
                  target:
                    entity_id: remote.living_room_tv
                  data:
                    command: Right
              - type: custom:mushroom-template-card
                primary: VOL -
                icon: mdi:volume-minus
                layout: vertical
                tap_action:
                  action: call-service
                  service: remote.send_command
                  target:
                    entity_id: remote.living_room_tv
                  data:
                    command: VolumeDown
              - type: custom:mushroom-template-card
                primary: Down
                icon: mdi:chevron-down
                layout: vertical
                tap_action:
                  action: call-service
                  service: remote.send_command
                  target:
                    entity_id: remote.living_room_tv
                  data:
                    command: Down
              - type: custom:mushroom-template-card
                primary: CH -
                icon: mdi:chevron-double-down
                layout: vertical
                tap_action:
                  action: call-service
                  service: remote.send_command
                  target:
                    entity_id: remote.living_room_tv
                  data:
                    command: ChannelDown

          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Back
                icon: mdi:arrow-left
                layout: vertical
                tap_action:
                  action: call-service
                  service: remote.send_command
                  target:
                    entity_id: remote.living_room_tv
                  data:
                    command: Return
              - type: custom:mushroom-template-card
                primary: Home
                icon: mdi:home
                layout: vertical
                tap_action:
                  action: call-service
                  service: remote.send_command
                  target:
                    entity_id: remote.living_room_tv
                  data:
                    command: Home
              - type: custom:mushroom-template-card
                primary: Mute
                icon: mdi:volume-mute
                layout: vertical
                tap_action:
                  action: call-service
                  service: remote.send_command
                  target:
                    entity_id: remote.living_room_tv
                  data:
                    command: Mute

          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Play
                icon: mdi:play
                layout: vertical
                tap_action:
                  action: call-service
                  service: remote.send_command
                  target:
                    entity_id: remote.living_room_tv
                  data:
                    command: Play
              - type: custom:mushroom-template-card
                primary: Pause
                icon: mdi:pause
                layout: vertical
                tap_action:
                  action: call-service
                  service: remote.send_command
                  target:
                    entity_id: remote.living_room_tv
                  data:
                    command: Pause
              - type: custom:mushroom-template-card
                primary: Netflix
                icon: mdi:netflix
                icon_color: red
                layout: vertical
                tap_action:
                  action: call-service
                  service: remote.send_command
                  target:
                    entity_id: remote.living_room_tv
                  data:
                    command: Netflix

