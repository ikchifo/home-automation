views:
  # ───────────────────────────────────────────
  # HOME VIEW
  # ───────────────────────────────────────────
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 2
    cards:
      # Bottom navigation bar
      - type: custom:bubble-card
        card_type: horizontal-buttons-stack
        styles: |
          .horizontal-buttons-stack-container {
            z-index: 5;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--card-background-color);
            border-top: 1px solid var(--divider-color);
            padding-bottom: env(safe-area-inset-bottom);
          }
        1_link: /home-dashboard/home
        1_name: Home
        1_icon: mdi:home
        2_link: /home-dashboard/living-room
        2_name: Living Room
        2_icon: mdi:sofa
        3_link: /home-dashboard/kitchen
        3_name: Kitchen
        3_icon: mdi:countertop
        4_link: /home-dashboard/bedroom
        4_name: Bedroom
        4_icon: mdi:bed

    sections:
      - type: grid
        cards:
          # Welcome + weather
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: person.<your_person>
                icon: mdi:account
              - type: weather
                entity: weather.forecast_home
                show_conditions: true
                show_temperature: true

          # Quick room toggles
          - type: custom:mushroom-title-card
            title: Rooms

          - type: custom:mushroom-light-card
            entity: light.living_room
            name: Living Room
            icon: mdi:sofa
            use_light_color: true
            show_brightness_control: true
            show_color_temp_control: true
            layout: horizontal
            tap_action:
              action: toggle
            hold_action:
              action: navigate
              navigation_path: /home-dashboard/living-room

          - type: custom:mushroom-light-card
            entity: light.kitchen
            name: Kitchen
            icon: mdi:countertop
            use_light_color: true
            show_brightness_control: true
            show_color_temp_control: true
            layout: horizontal
            tap_action:
              action: toggle
            hold_action:
              action: navigate
              navigation_path: /home-dashboard/kitchen

          - type: custom:mushroom-light-card
            entity: light.bedroom_light_a
            name: Bedroom
            icon: mdi:bed
            use_light_color: true
            show_brightness_control: true
            layout: horizontal
            tap_action:
              action: toggle
            hold_action:
              action: navigate
              navigation_path: /home-dashboard/bedroom

          - type: custom:mushroom-light-card
            entity: light.entryway_light
            name: Entryway
            icon: mdi:door
            use_light_color: true
            show_brightness_control: true
            layout: horizontal

      - type: grid
        cards:
          # Media section
          - type: custom:mushroom-title-card
            title: Media

          - type: custom:mushroom-media-player-card
            entity: media_player.living_room_tv_2
            name: Living Room TV
            icon: mdi:television
            use_media_info: true
            show_volume_level: true
            media_controls:
              - on_off
              - play_pause_stop
            volume_controls:
              - volume_buttons
              - volume_mute
            layout: horizontal

          - type: custom:mushroom-media-player-card
            entity: media_player.chifo_s_hub_max
            name: Hub Max
            icon: mdi:google-home
            use_media_info: true
            show_volume_level: true
            media_controls:
              - on_off
              - play_pause_stop
            volume_controls:
              - volume_buttons
            layout: horizontal

          # System section
          - type: custom:mushroom-title-card
            title: System

          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: update.home_assistant_core_update
                icon: mdi:home-assistant
              - type: entity
                entity: update.adguard_home_update
                icon: mdi:shield-check
              - type: entity
                entity: update.tailscale_update
                icon: mdi:vpn

  # ───────────────────────────────────────────
  # LIVING ROOM VIEW
  # ───────────────────────────────────────────
  - title: Living Room
    path: living-room
    icon: mdi:sofa
    type: sections
    max_columns: 2
    cards:
      - type: custom:bubble-card
        card_type: horizontal-buttons-stack
        styles: |
          .horizontal-buttons-stack-container {
            z-index: 5;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--card-background-color);
            border-top: 1px solid var(--divider-color);
